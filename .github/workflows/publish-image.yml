---
name: Publish Image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target platform
        required: true
        default: linux/arm64
        type: choice
        options:
          - linux/arm64
          - linux/arm

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: nitro-node-dev
          platforms: ${{ inputs.arch }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gha-${{ github.sha }}-${{ inputs.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gha-latest-${{ inputs.arch }}

      - name: Summarize image
        shell: bash
        run: |
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gha-${{ github.sha }}-${{ inputs.arch }}"
          echo "Pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gha-latest-${{ inputs.arch }}"
