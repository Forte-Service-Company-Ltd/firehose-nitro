---
name: GHA Credentials Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-app-token:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate GitHub App token
        id: get-token
        uses: actions/create-github-app-token@v3
        with: # GitHub Actions Deployment App
          app-id: ${{ vars.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
          #owner: Forte-Service-Company-Ltd
          #repositories: firehose-nitro

      - name: Confirm token was created
        shell: bash
        run: |
          echo "GitHub App token created successfully"
          echo "token_length=${#TOKEN}"
        env:
          TOKEN: ${{ steps.get-token.outputs.token }}
